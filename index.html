<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>3D Cups</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="canvas-container"></div>

    <div class="loader" id="loader" role="status" aria-live="polite" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span class="loader-text" id="loader-text">Загрузка…</span>
    </div>

    <div class="drop-overlay" id="drop-overlay" hidden>
      <div class="drop-overlay__message">Перетащите изображение или .glb-модель</div>
    </div>

    <nav class="controls-panel" aria-label="Управление просмотром">
      <div class="btn-wrap">
        <!-- Кружочки фонов строит UIManager из config.backgrounds -->
        <div class="popover popover--swatches">
          <div class="popover__inner" id="bg-swatches" role="menu" aria-label="Выбор фона"></div>
        </div>
        <button class="btn" id="bg-btn" type="button" title="Сменить фон (B)" aria-label="Сменить фон">
          <img class="btn__icon" src="assets/icons/background.svg" alt="" aria-hidden="true" />
        </button>
      </div>
      <div class="btn-wrap" id="rotate-wrap">
        <!-- Слайдер ручного поворота модели -->
        <div class="popover popover--slider">
          <div class="popover__inner">
            <input class="rotate-slider" id="rotate-slider" type="range" min="0" max="360" step="1" value="0" aria-label="Повернуть модель вручную" />
          </div>
        </div>
        <button class="btn is-active" id="autorotate-btn" type="button" title="Автоповорот (A)" aria-label="Автоповорот" aria-pressed="true">
          <img class="btn__icon" src="assets/icons/autorotate.svg" alt="" aria-hidden="true" />
        </button>
      </div>
      <button class="btn" id="screenshot-btn" type="button" title="Скриншот (S)" aria-label="Сделать скриншот">
        <img class="btn__icon" src="assets/icons/screenshot.svg" alt="" aria-hidden="true" />
      </button>
      <button class="btn" id="fullscreen-btn" type="button" title="Полный экран (F)" aria-label="Полноэкранный режим">
        <img class="btn__icon" src="assets/icons/fullscreen.svg" alt="" aria-hidden="true" />
      </button>

      <span class="divider" aria-hidden="true"></span>

      <button class="btn btn--texture" id="texture-btn" type="button" title="Заменить дизайн">
        <img class="btn__icon" src="assets/icons/texture.svg" alt="" aria-hidden="true" />
        <span class="btn__label">Заменить дизайн</span>
      </button>
      <input type="file" id="texture-input" accept="image/*" hidden />
    </nav>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
