<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Съёмка мокапов</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f7;--card:#fff;--line:#e2e5e8;--ink:#15181c;
      --dim:#6b7075;--accent:#1f6feb;--warn:#a8341f;--ok:#1a7f37}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:14px/1.5 system-ui,"Segoe UI",sans-serif}
header{padding:20px 28px 14px;border-bottom:1px solid var(--line);background:var(--card)}
h1{margin:0 0 4px;font-size:19px}
.sub{color:var(--dim);font-size:13px}
main{display:grid;grid-template-columns:minmax(320px,380px) 1fr;gap:22px;
     padding:22px 28px;align-items:start}
@media(max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card+.card{margin-top:16px}
h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
label.opt{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:7px;cursor:pointer}
label.opt:hover{background:rgba(127,127,127,.09)}
label.opt input{margin:3px 0 0}
.name{font-weight:600}
.hint{color:var(--dim);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row label.opt{flex:1 1 90px;justify-content:center;border:1px solid var(--line);text-align:center}
.row label.opt span{display:block}
.row label.opt .hint{margin-top:2px;font-size:11.5px}
.row label.opt:has(input:checked){border-color:var(--accent);
     box-shadow:inset 0 0 0 1px var(--accent);background:rgba(31,111,235,.07)}
select,input[type=text]{width:100%;padding:8px 9px;border:1px solid var(--line);
     border-radius:7px;background:var(--card);color:var(--ink);font:inherit}
.actions{display:flex;gap:9px;margin-top:6px}
button{font:inherit;padding:10px 15px;border-radius:8px;border:1px solid var(--line);
       background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
#status{margin-bottom:10px;font-size:13px}
#log{height:330px;overflow:auto;background:#12151a;color:#d7dde4;border-radius:8px;
     padding:12px 14px;font:12.5px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap}
#log .head{color:#7fd18a}
#log .warn{color:#e6a23c}
#log .err{color:#f07171}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:4px}
figure{margin:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
figure img{display:block;width:100%;height:auto;background:#eceef0;cursor:zoom-in}
figcaption{padding:9px 11px 11px;font-size:12.5px}
figcaption b{display:block;font-size:13px;margin-bottom:2px}
.meta{color:var(--dim)}
.badge{display:inline-block;padding:1px 6px;border-radius:5px;background:rgba(127,127,127,.14);
       font-size:11.5px;margin-right:4px}
.warnrow{color:var(--warn)}
dialog{border:none;border-radius:10px;padding:0;max-width:94vw;max-height:94vh;background:#000}
dialog img{display:block;max-width:94vw;max-height:94vh}
dialog::backdrop{background:rgba(0,0,0,.72)}
@media(prefers-color-scheme:dark){
  :root{--bg:#15171a;--card:#1d2024;--line:#2c3036;--ink:#e8eaed;--dim:#9aa0a6}
}
</style>
</head>
<body>
<header>
  <h1>Съёмка мокапов</h1>
  <div class="sub" id="head">Загрузка…</div>
</header>

<main>
  <section>
    <div class="card">
      <h2>Фон</h2>
      <div id="sets"></div>
      <div class="actions">
        <button id="all">Выбрать все</button>
        <button id="none">Снять выбор</button>
      </div>
    </div>

    <div class="card">
      <h2>Объём</h2>
      <div class="row" id="cups"></div>
    </div>

    <div class="card">
      <h2>Печать</h2>
      <div class="row" id="modes"></div>
      <div style="margin-top:10px">
        <div class="hint" style="margin-bottom:5px">Макет</div>
        <select id="art"></select>
      </div>
    </div>

    <div class="card">
      <h2>Качество</h2>
      <div class="row" id="quality" style="align-items:stretch"></div>
      <label class="opt" style="margin-top:8px">
        <input type="checkbox" id="nosave">
        <span><span class="name">Не сохранять .blend</span>
        <span class="hint">быстрее и без тяжёлых файлов</span></span>
      </label>
      <div class="actions">
        <button class="primary" id="go">Снять</button>
        <button id="stop">Стоп</button>
      </div>
    </div>
  </section>

  <section>
    <div class="card">
      <h2>Ход работы</h2>
      <div id="status">—</div>
      <div id="log"></div>
    </div>

    <div class="card">
      <h2>Готовые кадры</h2>
      <div class="grid" id="gallery"></div>
    </div>
  </section>
</main>

<dialog id="viewer"><img alt=""></dialog>

<script>
const $ = s => document.querySelector(s);
let cursor = 0, state = null;

function radios(host, items, name, checked){
  host.innerHTML = items.map(i =>
    `<label class="opt"><input type="radio" name="${name}" value="${i.value}"
     ${i.value === checked ? 'checked' : ''}><span><span class="name">${i.label}</span>
     ${i.hint ? `<span class="hint">${i.hint}</span>` : ''}</span></label>`).join('');
}
function pick(name){
  const el = document.querySelector(`input[name=${name}]:checked`);
  return el ? el.value : null;
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function drawSets(sets){
  $('#sets').innerHTML = sets.map(s => `
    <label class="opt"><input type="checkbox" class="set" value="${s.name}">
      <span><span class="name">${esc(s.title)}</span>
      <span class="hint">${esc(s.name)} · ${esc(s.kind)}</span></span></label>`).join('');
}

function drawGallery(items){
  if(!items.length){ $('#gallery').innerHTML = '<div class="hint">Пока ничего не снято.</div>'; return; }
  $('#gallery').innerHTML = items.map(i => {
    const bits = [];
    if(i.draft) bits.push('<span class="badge">черновик</span>');
    if(i.cup) bits.push(`<span class="badge">${esc(i.cup)} мл</span>`);
    if(i.print_mode) bits.push(`<span class="badge">печать ${esc(i.print_mode)}</span>`);
    else bits.push('<span class="badge">чистый</span>');
    const lines = [];
    if(i.resolution) lines.push(`${i.resolution[0]}×${i.resolution[1]}, ${i.samples} сэмплов`);
    if(i.on_wall_mm) lines.push(`на стенке ${i.on_wall_mm[0]}×${i.on_wall_mm[1]} мм, искажение ${i.distortion_pct}%`);
    if(i.scale && Math.abs(i.scale-1) > 1e-9) lines.push(`в сцене ×${i.scale.toFixed(3)}`);
    const warn = i.warnings.length
      ? `<div class="warnrow">${i.warnings.map(esc).join('<br>')}</div>` : '';
    return `<figure><img src="${i.url}?t=${i.mtime}" alt="${esc(i.stem)}" loading="lazy">
      <figcaption><b>${esc(i.stem)}</b>${bits.join('')}
      <div class="meta">${lines.map(esc).join('<br>')}</div>${warn}</figcaption></figure>`;
  }).join('');
  document.querySelectorAll('#gallery img').forEach(img => img.onclick = () => {
    $('#viewer img').src = img.src; $('#viewer').showModal();
  });
}

async function loadGallery(){
  // После рендера обновляется только галерея: перерисовка всей панели сбрасывала
  // бы выбранные фон, объём и качество прямо посреди работы.
  const s = await (await fetch('/api/state')).json();
  drawGallery(s.gallery);
}

async function load(){
  state = await (await fetch('/api/state')).json();
  $('#head').textContent = state.blender
    ? 'Blender: ' + state.blender
    : 'Blender не найден — считать нечем';
  drawSets(state.sets);
  radios($('#cups'), state.cups.map(c => ({value:c, label:c + ' мл'})), 'cup', state.cup);
  radios($('#modes'), [{value:'none',label:'без печати'},{value:'rect',label:'прямоугольник'},
                       {value:'cone',label:'полная'}], 'mode', 'none');
  radios($('#quality'), Object.entries(state.quality).map(([v,q]) => ({
    value: v, label: q.title,
    hint: (q.samples ? `${q.resolution} px, ${q.samples} сэмплов` : 'как в файле фона')
          + (q.folder ? ` · в «${q.folder}»` : '')
  })), 'quality', 'final');
  const uniform = [...new Set(state.sets.map(s => `${s.resolution}/${s.samples}`))];
  if(uniform.length === 1){
    const [res, smp] = uniform[0].split('/');
    document.querySelectorAll('input[name=quality][value=final]')[0]
      .closest('label').querySelector('.hint').textContent = `${res} px, ${smp} сэмплов`;
  }
  $('#art').innerHTML = '<option value="">как в настройках</option>' +
    state.art.map(a => `<option value="mockup/art/${a}">${esc(a)}</option>`).join('');
  drawGallery(state.gallery);
}

function classify(line){
  if(line.startsWith('###')) return 'head';
  if(/WARN|ВНИМАНИЕ/.test(line)) return 'warn';
  if(/Error|Traceback|ошибк/i.test(line)) return 'err';
  return '';
}

async function poll(){
  try{
    const r = await (await fetch('/api/log?since=' + cursor)).json();
    if(r.lines.length){
      const box = $('#log'), stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
      box.insertAdjacentHTML('beforeend', r.lines.map(l =>
        `<div class="${classify(l)}">${esc(l)}</div>`).join(''));
      if(stick) box.scrollTop = box.scrollHeight;
      cursor = r.cursor;
    }
    const j = r.job;
    const busy = j.running || j.pending.length;
    $('#go').disabled = !!busy;
    $('#status').innerHTML = busy
      ? `Считается: <b>${esc(j.current || '—')}</b>` +
        (j.total ? ` · ${j.done + 1} из ${j.total}` : '') +
        (j.pending.length ? `<div class="hint">в очереди: ${j.pending.map(esc).join(', ')}</div>` : '')
      : 'Свободно';
    if(!busy && poll.wasBusy) loadGallery();
    poll.wasBusy = busy;
  }catch(e){ $('#status').textContent = 'Сервер не отвечает'; }
  setTimeout(poll, 900);
}

$('#all').onclick = () => document.querySelectorAll('.set').forEach(c => c.checked = true);
$('#none').onclick = () => document.querySelectorAll('.set').forEach(c => c.checked = false);
$('#stop').onclick = () => fetch('/api/stop', {method:'POST'});
$('#viewer').onclick = () => $('#viewer').close();

$('#go').onclick = async () => {
  const sets = [...document.querySelectorAll('.set:checked')].map(c => c.value);
  const body = {sets, cup: pick('cup'), print: pick('mode'), quality: pick('quality'),
                art: $('#art').value, no_save: $('#nosave').checked};
  const r = await fetch('/api/render', {method:'POST', headers:{'Content-Type':'application/json'},
                                        body: JSON.stringify(body)});
  if(!r.ok){ const e = await r.json(); $('#status').textContent = 'Не запустилось: ' + e.error; }
};

load(); poll();
</script>
</body>
</html>
