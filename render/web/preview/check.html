<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сверка превью</title>
<style>
  :root { --bg: #f5f5f7; --card: #fff; --ink: #1d1d1f; --mute: #6e6e73; --ok: #1a7f37; --bad: #c9302c; --line: #e5e5ea; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --card: #1c1c1e; --ink: #f5f5f7; --mute: #98989d; --ok: #3fb950; --bad: #ff6b6b; --line: #2c2c2e; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.note { color: var(--mute); margin: 0 0 18px; }
  #summary { font-weight: 600; margin-bottom: 14px; }
  .case { display: grid; grid-template-columns: 220px 1fr; gap: 16px; background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .case img { width: 220px; border-radius: 10px; display: block; background: #000; }
  .case h2 { font-size: 15px; margin: 0 0 6px; }
  .case table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .case td { padding: 2px 12px 2px 0; }
  .case td:first-child { color: var(--mute); }
  .ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; }
  canvas#gl { position: absolute; left: -10000px; top: 0; }
  @media (max-width: 560px) { .case { grid-template-columns: 1fr; } .case img { width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>Сверка превью с рендером</h1>
  <p class="note">Маска силуэтов из Blender (engine/tools/preview_mask.py) против того же кадра в превью.
    На картинке: белое — совпало, красное — только в Blender, зелёное — только в превью. Приёмка этапа 3 — не больше 2 px.</p>
  <div id="summary">Считаю…</div>
  <div id="cases"></div>
</main>
<canvas id="gl"></canvas>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<script type="module" src="./check.js"></script>
</body>
</html>
