<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Превью кадра</title>
<style>
  :root {
    color-scheme: light;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;
    --bg: #f5f5f7; --surface: #fff; --surface-2: #f5f5f7; --ink: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea;
    --fill: rgba(0,0,0,.05); --segment-on: #fff; --segment-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04);
    --action: #0071e3; --danger: #d4351c; --success: #1f8f55; --pill: 980px; --radius-l: 14px; --radius-xl: 20px;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark; --bg: #101012; --surface: #1c1c1e; --surface-2: #272729; --ink: #f5f5f7; --muted: #aeaeb2;
      --line: #3a3a3c; --fill: rgba(255,255,255,.08); --segment-on: #636366; --segment-shadow: 0 1px 2px rgba(0,0,0,.4);
      --action: #0a84ff; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark; --bg: #101012; --surface: #1c1c1e; --surface-2: #272729; --ink: #f5f5f7; --muted: #aeaeb2;
    --line: #3a3a3c; --fill: rgba(255,255,255,.08); --segment-on: #636366; --segment-shadow: 0 1px 2px rgba(0,0,0,.4);
    --action: #0a84ff; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
  header { padding: 18px 24px 6px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; padding: 12px 24px 32px; max-width: 1400px; margin: 0 auto; }
  .stage { background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .frame { position: relative; margin: 0 auto; max-width: 100%; }
  .frame canvas { display: block; width: 100%; height: auto; border-radius: 10px; background: #000; touch-action: none; cursor: grab; }
  .frame canvas.dragging { cursor: grabbing; }
  .frame .safe { position: absolute; inset: 0; pointer-events: none; }
  .status { font-size: 13px; color: var(--muted); min-height: 1.4em; font-variant-numeric: tabular-nums; }
  .status .bad { color: var(--danger); }
  .hint { font-size: 12px; color: var(--muted); }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--shadow); padding: 14px; }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted); text-transform: none; }
  select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  textarea { font: 12px/1.4 ui-monospace, Consolas, monospace; min-height: 150px; resize: vertical; }
  .seg { display: flex; flex-wrap: wrap; gap: 2px; background: var(--fill); border-radius: 10px; padding: 2px; }
  .seg button { flex: 1 1 auto; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer; min-height: 32px; }
  .seg button[aria-pressed="true"] { background: var(--segment-on); box-shadow: var(--segment-shadow); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .row label { font-size: 13px; color: var(--muted); min-width: 64px; }
  .row input[type=range] { flex: 1; accent-color: var(--action); }
  .pill { border: 0; border-radius: var(--pill); padding: 8px 16px; font: inherit; font-size: 14px; cursor: pointer; background: var(--fill); color: var(--ink); min-height: 36px; }
  .pill.primary { background: var(--action); color: #fff; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 14px; background: rgba(0,0,0,.35); border-radius: 10px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .loading.on { opacity: 1; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; padding: 12px 16px 24px; } header { padding: 16px 16px 4px; } }
  @media (prefers-reduced-motion: reduce) { .loading { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Превью кадра</h1>
  <p>Фон — снимок из камеры сцены, стаканы — настоящие модели. Кадр и места стаканов совпадают с рендером (сверка — <a href="check.html">check.html</a>).</p>
</header>
<div class="app">
  <section class="stage">
    <div class="frame" id="frame">
      <canvas id="view" aria-label="Кадр: тяните стакан, колесо — поворот"></canvas>
      <svg class="safe" id="safe" preserveAspectRatio="none" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <div class="loading" id="loading">Загружаю сцену…</div>
    </div>
    <div class="status" id="status"></div>
    <div class="hint">Тяните стакан по площадке. Колесо над стаканом — поворот на 5°, с Shift — на 1°.</div>
  </section>
  <aside>
    <div class="card"><h2>Сцена</h2><select id="scene"></select></div>
    <div class="card"><h2>Ракурс</h2><div class="seg" id="presets"></div></div>
    <div class="card"><h2>Формат</h2><div class="seg" id="frames"></div></div>
    <div class="card">
      <h2>Стаканы</h2>
      <select id="hero" aria-label="Главный стакан"></select>
      <div class="row"><label for="rot0">поворот</label><input type="range" id="rot0" min="-180" max="180" step="1" value="0"><span id="rot0v">0°</span></div>
      <div class="pills">
        <button class="pill" id="pair">Пара</button>
        <button class="pill" id="bigger">Объём больше</button>
        <button class="pill" id="smaller">Объём меньше</button>
        <button class="pill" id="single">Один</button>
      </div>
      <div id="secondBox" hidden>
        <select id="second" aria-label="Второй стакан" style="margin-top:10px"></select>
        <div class="row"><label for="rot1">поворот</label><input type="range" id="rot1" min="-180" max="180" step="1" value="150"><span id="rot1v">150°</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Задание для рендера</h2>
      <textarea id="job" readonly></textarea>
      <div class="pills"><button class="pill primary" id="copy">Скопировать</button></div>
    </div>
  </aside>
</div>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
